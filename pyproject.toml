[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "archicad-codex-connector"
version = "0.1.0"
description = "Local Archicad JSON/Tapir connector for MCP clients"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "jsonschema==4.26.0", "pydantic==2.14.0"]

[project.scripts]
archicad-connector = "archicad_connector.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "build==1.4.0", "ruff==0.16.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/archicad_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
